name = "nexus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Inference runs inside Cloudflare, so this binding IS the credential and no
# third-party API key exists in the project at all.
[ai]
binding = "AI"

# Product passages for retrieval. 384 dimensions to match bge-small-en-v1.5;
# cosine because the embeddings are normalised.
[[vectorize]]
binding = "VECTORIZE"
index_name = "nexus-products"

[[d1_databases]]
binding = "ORDERS"
database_name = "nexus-orders"
database_id = "7aa62821-d17f-43a2-b605-2643780e9690"

# Merchant product photos. nexus-console writes, nexus-api serves (/media/u/*).
# One bucket per environment: a shared one would put staging's demo uploads
# behind production URLs, which is the mistake the shared Vectorize index is.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nexus-media"

[vars]
# The deployed storefront and the dev server, in that order. The first entry is
# what an unrecognised origin gets echoed back, so it must not be localhost.
ALLOWED_ORIGIN = "https://nexus-tech-collective.mingzhe030228.workers.dev,http://localhost:5173"

# Who verification email comes from. The domain must be verified with the mail
# provider, or every send is refused with a reason only the log sees.
MAIL_FROM = "NEXUS <onboarding@resend.dev>"

# Guessing throttles. Two namespaces because signing in and signing up deserve
# different budgets, and a shared counter would let one starve the other.
#
# This is Cloudflare's own rate limiter: per-colo and in-memory, so it is the
# cheap first line rather than the whole defence. The per-account backoff in
# auth.ts is the global, durable half — it is what sees a botnet spreading one
# account's guesses across a thousand addresses, which none of these counters
# ever would.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# The counter that can be trusted. Cloudflare's own limiter above is per-isolate
# and best-effort — twenty-five parallel sign-ups against a 5-per-minute limit
# produced one refusal — so it is the pre-filter and this is the limit.
[[durable_objects.bindings]]
name = "IP_THROTTLE"
class_name = "IpThrottle"

# SQLite-backed, which is the class of Durable Object available without a paid
# Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpThrottle"]

# Nightly sweep of expired sessions and spent links. 04:17 rather than a round
# hour, because every cron on the platform fires on the hour and the quiet
# minutes are the ones nobody else picked.
[triggers]
crons = ["17 4 * * *"]

# Secrets are set with `wrangler secret put`, never written here:
#   wrangler secret put NEO4J_URI
#   wrangler secret put NEO4J_USER
#   wrangler secret put NEO4J_PASSWORD
#   wrangler secret put RESEND_API_KEY

# ---------------------------------------------------------------- staging --
#
# Deployed from the `staging` branch. Bindings are NOT inherited by an
# environment in wrangler, so every one is repeated here on purpose — an
# omission does not warn, it deploys a worker missing a binding.
#
# Orders go to their own database so a test checkout never lands in the
# production ledger. Vectorize and Workers AI are shared: both are read-only
# from this service, and a second copy of the index would only drift.
#
# Secrets are per-environment too. Until these are set, staging answers with
# the graph reported unavailable by /api/health, which is the degraded mode the
# code already handles rather than a crash:
#
#   cd worker
#   npx wrangler secret put NEO4J_URI --env staging
#   npx wrangler secret put NEO4J_USER --env staging
#   npx wrangler secret put NEO4J_PASSWORD --env staging
#   npx wrangler secret put NEO4J_DATABASE --env staging
#   npx wrangler d1 execute nexus-orders-staging --remote --file=schema.sql
#
# NEO4J_DATABASE is a secret rather than a var even though it is only a name.
# Aura names the database after the instance and its hostname is
# <instance>.databases.neo4j.io, so committing the name publishes the endpoint
# NEO4J_URI is kept secret to withhold. It is not a credential; it is the
# address a credential opens.
[env.staging]
name = "nexus-api-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "nexus-products"

[[env.staging.d1_databases]]
binding = "ORDERS"
database_name = "nexus-orders-staging"
database_id = "aedb0572-7924-4068-8d30-11b6e61eeed5"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "nexus-media-staging"

[env.staging.vars]
ALLOWED_ORIGIN = "https://nexus-tech-collective-staging.mingzhe030228.workers.dev,http://localhost:5173"
MAIL_FROM = "NEXUS <onboarding@resend.dev>"

[[env.staging.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "SIGNUP_LIMITER"
namespace_id = "2002"
simple = { limit = 5, period = 60 }

[[env.staging.durable_objects.bindings]]
name = "IP_THROTTLE"
class_name = "IpThrottle"

[env.staging.triggers]
crons = ["47 4 * * *"]


