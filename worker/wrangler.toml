name = "nexus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Inference runs inside Cloudflare, so this binding IS the credential and no
# third-party API key exists in the project at all.
[ai]
binding = "AI"

# Product passages for retrieval. 384 dimensions to match bge-small-en-v1.5;
# cosine because the embeddings are normalised.
[[vectorize]]
binding = "VECTORIZE"
index_name = "nexus-products"

[[d1_databases]]
binding = "ORDERS"
database_name = "nexus-orders"
database_id = "7aa62821-d17f-43a2-b605-2643780e9690"

[vars]
# The deployed storefront and the dev server, in that order. The first entry is
# what an unrecognised origin gets echoed back, so it must not be localhost.
ALLOWED_ORIGIN = "https://nexus-tech-collective.mingzhe030228.workers.dev,http://localhost:5173"

# Secrets are set with `wrangler secret put`, never written here:
#   wrangler secret put NEO4J_URI
#   wrangler secret put NEO4J_USER
#   wrangler secret put NEO4J_PASSWORD
